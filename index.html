<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0e12">
<title>Vezune — Distributeurs Automatiques</title>
<link rel="icon" type="image/png" href="./logo.png?v=4">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   FUTURISTIC APPLE DESIGN SYSTEM — CSS VARIABLES
   ========================================================================== */
:root {
  --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", Roboto, sans-serif;
  --font-display: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "SF Mono", "Fira Code", Menlo, Monaco, monospace;

  /* Color Palette (Light Theme) */
  --bg-primary: #f2f4f8;
  --bg-secondary: #ffffff;
  --bg-tertiary: #e7eaf0;
  --bg-glass: rgba(255, 255, 255, 0.82);
  --bg-glass-strong: rgba(255, 255, 255, 0.94);
  --bg-glass-card: rgba(255, 255, 255, 0.78);
  
  --border-subtle: rgba(0, 0, 0, 0.07);
  --border-glass: rgba(255, 255, 255, 0.85);
  --border-glow: rgba(0, 122, 255, 0.35);

  --text-primary: #0f1115;
  --text-secondary: #5a606d;
  --text-tertiary: #8b92a0;
  --text-quaternary: #b5bac5;

  --apple-blue: #0071e3;
  --apple-blue-hover: #005bb5;
  --apple-blue-soft: rgba(0, 113, 227, 0.12);
  --apple-cyan: #00c7be;
  --apple-cyan-soft: rgba(0, 199, 190, 0.14);
  --apple-green: #34c759;
  --apple-green-soft: rgba(52, 199, 89, 0.14);
  --apple-indigo: #5856d6;
  --apple-indigo-soft: rgba(88, 86, 214, 0.14);
  --apple-orange: #ff9500;
  --apple-orange-soft: rgba(255, 149, 0, 0.14);
  --apple-red: #ff3b30;
  --apple-red-soft: rgba(255, 59, 48, 0.14);

  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-xl: 28px;
  --radius-pill: 9999px;

  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 10px 28px -6px rgba(15, 23, 42, 0.09);
  --shadow-lg: 0 24px 50px -12px rgba(15, 23, 42, 0.16);
  --shadow-card: 0 8px 25px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  --glow-blue: 0 0 20px rgba(0, 113, 227, 0.25);
  --glow-cyan: 0 0 20px rgba(0, 199, 190, 0.25);

  --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.18, 0.89, 0.32, 1.15);

  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg-primary: #07080a;
  --bg-secondary: #12141a;
  --bg-tertiary: #1c202a;
  --bg-glass: rgba(18, 20, 26, 0.82);
  --bg-glass-strong: rgba(22, 25, 33, 0.94);
  --bg-glass-card: rgba(18, 20, 26, 0.78);

  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-glass: rgba(255, 255, 255, 0.12);
  --border-glow: rgba(0, 199, 190, 0.4);

  --text-primary: #f4f6fa;
  --text-secondary: #9aa1b0;
  --text-tertiary: #6b7280;
  --text-quaternary: #454a55;

  --apple-blue: #2997ff;
  --apple-blue-hover: #54aeff;
  --apple-blue-soft: rgba(41, 151, 255, 0.18);
  --apple-cyan: #64d2ff;
  --apple-cyan-soft: rgba(100, 210, 255, 0.18);
  --apple-green: #30d158;
  --apple-green-soft: rgba(48, 209, 88, 0.18);
  --apple-indigo: #7d7aff;
  --apple-indigo-soft: rgba(125, 122, 255, 0.18);
  --apple-orange: #ff9f0a;
  --apple-orange-soft: rgba(255, 159, 10, 0.18);
  --apple-red: #ff453a;
  --apple-red-soft: rgba(255, 69, 58, 0.18);

  --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.6);
  --shadow-md: 0 12px 36px rgba(0, 0, 0, 0.75);
  --shadow-lg: 0 28px 70px rgba(0, 0, 0, 0.9);
  --shadow-card: 0 8px 28px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  --glow-blue: 0 0 24px rgba(41, 151, 255, 0.35);
  --glow-cyan: 0 0 24px rgba(100, 210, 255, 0.35);

  color-scheme: dark;
}

/* ==========================================================================
   RESET & FOUNDATIONS
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

html, body {
  min-height: 100%;
  font-family: var(--font-system);
  font-size: 15px;
  line-height: 1.45;
  color: var(--text-primary);
  background-color: var(--bg-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

body {
  background:
    radial-gradient(100% 70% at 10% 0%, var(--apple-blue-soft) 0%, transparent 60%),
    radial-gradient(90% 70% at 90% 10%, var(--apple-cyan-soft) 0%, transparent 50%),
    var(--bg-primary);
  background-attachment: fixed;
  min-height: 100vh;
}

input, button, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  border: none;
  background: none;
}
a { color: var(--apple-blue); text-decoration: none; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

/* Custom Scrollbars */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: rgba(120, 120, 128, 0.3); border-radius: 9999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(120, 120, 128, 0.5); }

/* SVG Icon Helper */
.svg-icon {
  display: inline-block;
  width: 1.2em;
  height: 1.2em;
  vertical-align: middle;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

/* ==========================================================================
   CARDS & GRIDS
   ========================================================================== */
.glass {
  background: var(--bg-glass-card);
  backdrop-filter: blur(32px) saturate(200%);
  -webkit-backdrop-filter: blur(32px) saturate(200%);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

.card {
  background: var(--bg-glass-card);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 18px;
  position: relative;
  transition: transform 0.2s var(--ease-apple), box-shadow 0.2s var(--ease-apple);
}

.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(2, 1fr); }
.g3 { grid-template-columns: repeat(2, 1fr); }
.g2 { grid-template-columns: 1fr; }
@media (min-width: 768px) {
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g2 { grid-template-columns: repeat(2, 1fr); }
}

/* Stat Cards */
.stat-card {
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 104px;
}
.stat-card .label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
}
.stat-card .value {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--text-primary);
  margin: 4px 0 2px;
}
.stat-card .delta {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Pills & Badges */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.01em;
  white-space: nowrap;
}
.pill-blue { background: var(--apple-blue-soft); color: var(--apple-blue); border: 1px solid rgba(41, 151, 255, 0.25); }
.pill-cyan { background: var(--apple-cyan-soft); color: var(--apple-cyan); border: 1px solid rgba(100, 210, 255, 0.25); }
.pill-green { background: var(--apple-green-soft); color: var(--apple-green); border: 1px solid rgba(52, 199, 89, 0.25); }
.pill-red { background: var(--apple-red-soft); color: var(--apple-red); border: 1px solid rgba(255, 59, 48, 0.25); }
.pill-amber { background: var(--apple-orange-soft); color: var(--apple-orange); border: 1px solid rgba(255, 149, 0, 0.25); }
.pill-gray { background: rgba(120, 120, 128, 0.12); color: var(--text-secondary); }

/* Buttons */
.btn {
  border-radius: var(--radius-md);
  padding: 12px 18px;
  font-weight: 700;
  font-size: 14.5px;
  letter-spacing: -0.01em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.12s var(--ease-spring), opacity 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  user-select: none;
  min-height: 44px;
}
.btn:active { transform: scale(0.96); opacity: 0.9; }
.btn-primary {
  background: linear-gradient(135deg, var(--apple-blue) 0%, var(--apple-blue-hover) 100%);
  color: #ffffff;
  box-shadow: 0 4px 18px -2px rgba(0, 113, 227, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}
.btn-primary:hover { box-shadow: 0 6px 24px -2px rgba(0, 113, 227, 0.65); }
.btn-ghost {
  background: rgba(120, 120, 128, 0.1);
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
}
.btn-ghost:hover { background: rgba(120, 120, 128, 0.16); }
.btn-soft-blue { background: var(--apple-blue-soft); color: var(--apple-blue); border: 1px solid rgba(41, 151, 255, 0.2); }
.btn-soft-blue:hover { background: rgba(0, 113, 227, 0.22); }
.btn-green-soft { background: var(--apple-green-soft); color: var(--apple-green); border: 1px solid rgba(52, 199, 89, 0.25); }
.btn-danger-soft { background: var(--apple-red-soft); color: var(--apple-red); border: 1px solid rgba(255, 59, 48, 0.25); }
.btn-lg { padding: 16px 24px; font-size: 16.5px; border-radius: var(--radius-lg); min-height: 52px; }

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  background: rgba(120, 120, 128, 0.1);
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s var(--ease-spring), background 0.15s ease, color 0.15s ease;
  flex-shrink: 0;
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn:hover { background: rgba(120, 120, 128, 0.18); color: var(--text-primary); }
.icon-btn.danger { background: var(--apple-red-soft); color: var(--apple-red); }

/* Form Controls */
.field { margin-bottom: 15px; }
.field label {
  display: block;
  font-size: 11.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 13px 15px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: rgba(120, 120, 128, 0.08);
  font-size: 16px;
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  min-height: 46px;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--apple-blue);
  background: var(--bg-secondary);
  box-shadow: 0 0 0 4px var(--apple-blue-soft);
}
.err-msg { color: var(--apple-red); font-size: 13px; font-weight: 700; margin-top: 6px; min-height: 18px; }

/* Segmented Controls */
.seg {
  display: inline-flex;
  background: rgba(120, 120, 128, 0.12);
  border-radius: var(--radius-sm);
  padding: 3px;
  gap: 3px;
  max-width: 100%;
  overflow-x: auto;
}
.seg button {
  padding: 8px 15px;
  border-radius: 9px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-secondary);
  transition: all 0.18s var(--ease-spring);
  white-space: nowrap;
}
.seg button.active {
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-weight: 700;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.04);
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 4px;
  border-bottom: 1px solid var(--border-subtle);
}
.toggle-row:last-child { border-bottom: none; }
.toggle-row .tr-label { font-weight: 700; font-size: 15px; }
.toggle-row .tr-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }

.switch {
  position: relative;
  width: 51px;
  height: 31px;
  flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.switch-track {
  position: absolute;
  inset: 0;
  background: rgba(120, 120, 128, 0.28);
  border-radius: var(--radius-pill);
  transition: background 0.24s var(--ease-spring);
  cursor: pointer;
}
.switch-track::before {
  content: "";
  position: absolute;
  width: 27px;
  height: 27px;
  left: 2px;
  top: 2px;
  background: #ffffff;
  border-radius: 50%;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2), 0 1px 1px rgba(0, 0, 0, 0.1);
  transition: transform 0.24s var(--ease-spring);
}
.switch input:checked + .switch-track { background: var(--apple-green); }
.switch input:checked + .switch-track::before { transform: translateX(20px); }

/* ==========================================================================
   IOS BOTTOM SHEETS & MODALS
   ========================================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index: 1000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn 0.2s var(--ease-apple);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--bg-glass-strong);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid var(--border-glass);
  border-radius: 30px 30px 0 0;
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 100%;
  max-height: 92vh;
  overflow-y: auto;
  animation: sheetUp 0.3s var(--ease-spring);
  padding-bottom: env(safe-area-inset-bottom);
  display: flex;
  flex-direction: column;
  position: relative;
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-grabber {
  width: 38px;
  height: 5px;
  border-radius: var(--radius-pill);
  background: rgba(120, 120, 128, 0.35);
  margin: 10px auto 4px;
  flex-shrink: 0;
}

@media (min-width: 768px) {
  .modal-overlay { align-items: center; padding: 24px; }
  .modal {
    border-radius: var(--radius-xl);
    max-width: 580px;
    animation: modalScale 0.25s var(--ease-spring);
  }
  .modal.wide { max-width: 820px; }
  .modal.full { max-width: 960px; }
  .modal-grabber { display: none; }
}
@keyframes modalScale {
  from { transform: scale(0.95) translateY(10px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 22px;
  border-bottom: 1px solid var(--border-subtle);
  position: sticky;
  top: 0;
  background: var(--bg-glass-strong);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  z-index: 10;
}
.modal-head h3 { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
.modal-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(120, 120, 128, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all 0.15s ease;
}
.modal-close:hover { background: rgba(120, 120, 128, 0.22); color: var(--text-primary); }
.modal-body { padding: 20px 22px; flex: 1; overflow-y: auto; }
.modal-foot {
  padding: 14px 22px calc(14px + env(safe-area-inset-bottom));
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-glass-strong);
}

/* ==========================================================================
   APP SHELL & NAVIGATION
   ========================================================================= */
#login-screen {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-card {
  width: 100%;
  max-width: 390px;
  padding: 44px 34px;
  text-align: center;
}
.brand-mark {
  width: 72px;
  height: 72px;
  margin: 0 auto 18px;
  border-radius: 22px;
  background: linear-gradient(135deg, var(--apple-blue), var(--apple-cyan));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--glow-blue), inset 0 1px 1px rgba(255, 255, 255, 0.7);
  position: relative;
  overflow: hidden;
}
.brand-mark::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, rgba(255, 255, 255, 0.5), transparent 50%);
}
.brand-mark svg {
  width: 36px;
  height: 36px;
  position: relative;
  z-index: 1;
  color: #ffffff;
}

#app-shell {
  display: none;
  position: relative;
  z-index: 1;
  min-height: 100vh;
}
.shell-inner { display: flex; min-height: 100vh; }

.sidebar {
  display: none;
  width: 250px;
  flex-shrink: 0;
  padding: 26px 16px;
  flex-direction: column;
  gap: 6px;
  position: sticky;
  top: 0;
  height: 100vh;
  background: var(--bg-glass-strong);
  border-right: 1px solid var(--border-glass);
  backdrop-filter: blur(35px) saturate(200%);
  -webkit-backdrop-filter: blur(35px) saturate(200%);
  z-index: 20;
}
.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 10px 22px;
}
.sidebar-brand .dot {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--apple-blue), var(--apple-cyan));
  flex-shrink: 0;
  box-shadow: var(--glow-blue);
}
.sidebar-brand span { font-weight: 800; font-size: 17px; letter-spacing: -0.02em; }
.sidebar-brand small { display: block; font-size: 12px; color: var(--text-secondary); font-weight: 600; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-weight: 700;
  font-size: 14.5px;
  transition: all 0.15s ease;
  border: none;
  background: transparent;
  text-align: left;
  width: 100%;
}
.nav-item svg { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.85; }
.nav-item:hover { background: rgba(120, 120, 128, 0.08); color: var(--text-primary); }
.nav-item.active { background: var(--apple-blue-soft); color: var(--apple-blue); }
.nav-item.active svg { opacity: 1; color: var(--apple-blue); }
.nav-badge { margin-left: auto; padding: 2px 7px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 800; }

.sidebar-foot { margin-top: auto; padding: 12px 6px 0; display: flex; flex-direction: column; gap: 8px; }
.save-indicator {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text-tertiary);
  padding: 0 6px 8px;
  font-weight: 600;
}
.save-indicator .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--apple-green);
  flex-shrink: 0;
  transition: background 0.2s ease;
}
.save-indicator.saving .dot { background: var(--apple-orange); animation: pulseDot 1s infinite; }
@keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

.main-area {
  flex: 1;
  padding: 18px 16px 120px;
  min-width: 0;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}
.topbar h2 { font-size: 26px; font-weight: 900; letter-spacing: -0.03em; }
.topbar .sub { color: var(--text-secondary); font-size: 13.5px; margin-top: 2px; font-weight: 500; }

}
.distrib-3d::before {
  content: "";

.distrib-top-panel {

}
.distrib-top-panel .logo-wrap { display: flex; align-items: center; gap: 10px; }
.distrib-top-panel .logo-badge {

}
.distrib-top-panel .distrib-title { font-weight: 800; font-size: 15px; letter-spacing: -0.01em; }
.distrib-screen {
  background: #050b14;

  padding: 6px 12px;

  font-weight: 700;

  gap: 7px;
  letter-spacing: 0.04em;
}
.distrib-screen .led {

.distrib-glass-cabinet {

  position: relative;

}
.distrib-glass-cabinet::after {

  position: absolute;

  pointer-events: none;
}

.distrib-floor {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 20px;
  padding: 12px;

  z-index: 1;
}
.distrib-floor-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.distrib-floor-num {
  font-size: 11.5px;
  font-weight: 800;
  color: #a6b0c3;
  display: flex;
  align-items: center;

  letter-spacing: 0.04em;
}
.distrib-floor-num span {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.14);
  color: #ffffff;

  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 900;
}

.distrib-slots {

}

/* Square High-Visibility Product Slots */
.slot-card {
  background: rgba(255, 255, 255, 0.09);

}
.slot-card:active { transform: scale(0.94); }
.slot-card:hover {

.slot-badge {

  font-size: 10px;
  font-weight: 900;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
  letter-spacing: 0.02em;
}

/* Perfect Square High-Contrast Image Box */
.slot-img-box {
  width: 62px;
  height: 62px;
  aspect-ratio: 1 / 1;
  margin: 4px auto 6px;
  border-radius: 14px;
  background: radial-gradient(circle at center, rgba(255, 255, 255, 0.15) 0%, rgba(0, 0, 0, 0.4) 100%);

  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5px;
  overflow: hidden;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
}
.slot-img-box img {
  width: 100%;
  height: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45));
}
.slot-img-box .placeholder {
  color: #8b92a0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.slot-name {
  font-size: 11.5px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.01em;
}
.slot-price {
  font-size: 12.5px;
  font-weight: 900;
  color: #64d2ff;
  margin-top: 2px;
}
.slot-gauge {
  height: 4.5px;

  margin-top: 6px;
}
.slot-gauge-fill {
  height: 100%;

}
.slot-gauge-fill.low { background: var(--apple-red); }
.slot-gauge-fill.mid { background: var(--apple-orange); }
.slot-qty-text {

}

.distrib-bottom-tray {
  margin-top: 16px;
  height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;
}
.distrib-bottom-tray::before {
  content: "";
  width: 48%;
  height: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.18);
}

/* ==========================================================================
   2D HEATMAP
   ========================================================================== */
.heatmap-grid { display: flex; flex-direction: column; gap: 12px; }
.heatmap-floor {
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px;
}
.heatmap-slots {
  display: grid;

  gap: 10px;
  margin-top: 10px;
}
.heatmap-slot {
  border-radius: var(--radius-sm);
  padding: 12px 10px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s var(--ease-spring), box-shadow 0.15s ease;
  border: 1px solid transparent;
  position: relative;
}
.heatmap-slot:active { transform: scale(0.95); }
.heatmap-slot .hm-badge { font-size: 10.5px; font-weight: 900; opacity: 0.8; }
.heatmap-slot .hm-prod {

  text-overflow: ellipsis;
  margin: 4px 0 2px;
}

/* ==========================================================================
   WIZARDS & WHEEL INPUTS
   ========================================================================== */
.wizard-progress { margin-bottom: 22px; }
.wizard-progress-bar {

}
.wizard-step-title {

}

.img-grid {

  align-items: flex-start;
}
.hist-item:last-child { border-bottom: none; }
.hist-dot {

  height: 38px;

  align-items: center;
  justify-content: center;
}
.hist-body { flex: 1; min-width: 0; }
.hist-title { font-weight: 800; font-size: 14.5px; }

/* Tables */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

th {

  color: var(--text-tertiary);
  font-weight: 800;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-subtle);

}
td {

  vertical-align: middle;
}
tr:hover td { background: rgba(120, 120, 128, 0.04); }

/* Toast Notifications */
#toast-container {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  width: calc(100% - 32px);
  max-width: 400px;
}
.toast {
  background: var(--bg-glass-strong);
  backdrop-filter: blur(35px) saturate(200%);
  -webkit-backdrop-filter: blur(35px) saturate(200%);
  border: 1px solid var(--border-glass);
  padding: 14px 20px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 700;
  box-shadow: var(--shadow-lg);
  color: var(--text-primary);
  animation: toastSlide 0.3s var(--ease-spring);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
@keyframes toastSlide {
  from { opacity: 0; transform: translateY(-16px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
</style>

<script>
(function(){
"use strict";

/* ==========================================================================
   1. CONFIGURATION & SÉCURITÉ
   ========================================================================== */
const ROOT_ADMIN_ID = "distrib-vezune-saya";
const ROOT_ADMIN_PW = "vN7!qR2#Lx9@Tm4$Kp8&Zs6";

async function hashPassword(str, salt){
  salt = salt || "vezune-salt-v2";
  const encoder = new TextEncoder();
  const data = encoder.encode(str + ":" + salt);
  if(window.crypto && window.crypto.subtle){
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let hash = 0;
  for(let i = 0; i < str.length; i++){
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return "h_" + Math.abs(hash).toString(16);
}

/* ==========================================================================
   2. STORAGE & PERSISTENCE (OPTIMISÉ POUR GITHUB PAGES)
   ========================================================================== */
async function storeGet(key, fallback){
  try {
    if(!window.storage){
      const raw = localStorage.getItem('vezune:' + key);
      return raw == null ? fallback : JSON.parse(raw);
    }
    const r = await window.storage.get(key, false);
    if(!r || r.value === undefined) return fallback;
    return JSON.parse(r.value);
  } catch(e){ return fallback; }
}

function markSaving(){
  const ind = document.getElementById('save-indicator');
  const txt = document.getElementById('save-indicator-text');
  if(!ind) return;
  ind.classList.add('saving');
  if(txt) txt.textContent = 'Enregistrement…';
}
function markSaved(){
  const ind = document.getElementById('save-indicator');
  const txt = document.getElementById('save-indicator-text');
  if(!ind) return;
  ind.classList.remove('saving');
  if(txt) txt.textContent = 'Synchronisé · ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

async function storeSet(key, value){
  markSaving();
  try {
    if(!window.storage){
      localStorage.setItem('vezune:' + key, JSON.stringify(value));
    } else {
      await window.storage.set(key, JSON.stringify(value), false);
    }
    markSaved();
  } catch(e){
    console.error("Storage error:", key, e);
    const txt = document.getElementById('save-indicator-text');
    if(txt) txt.textContent = 'Erreur synchro';
  }
}

/* ==========================================================================
   3. ÉTAT INITIAL VIERGE (0 DATA DEFAULT)
   ========================================================================== */
const State = {
  currentUser: null,
  profil: null,
  distributeurs: [],
  currentDistribId: null,
  stock: [],
  achats: [],

/* ==========================================================================
   4. BIBLIOTHÈQUE D'IMAGES (FORMAT CARRÉ 1:1)
   ========================================================================== */
const DEFAULT_IMAGE_LIBRARY = [
  { file: 'coca.png', label: 'Coca-Cola Standard', category: 'Boissons' },
  { file: 'coca cherry.webp', label: 'Coca-Cola Cherry', category: 'Boissons' },
  { file: 'logo.jfif', label: 'Logo Vezune', category: 'Marque' },
  { file: 'logo.png', label: 'Logo Vezune PNG', category: 'Marque' }
];

function getFullImageLibrary(){
  const custom = Array.isArray(State.images) ? State.images : [];
  const map = new Map();
  DEFAULT_IMAGE_LIBRARY.forEach(img => map.set(img.file, img));
  custom.forEach(img => map.set(img.file, img));
  return Array.from(map.values());
}

function resolveImageSrc(file){
  if(!file) return '';
  if(file.startsWith('data:') || file.startsWith('http://') || file.startsWith('https://')) return file;
  const customMatch = (State.images || []).find(img => img.file === file);
  if(customMatch && customMatch.dataUrl) return customMatch.dataUrl;
  return './image/' + file;
}

/* ==========================================================================
   5. UTILITAIRES & FORMATTAGE (SANS AUCUN ÉMOJI)
   ========================================================================== */
function uid(){ return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }

function fmtMoney(n){
  n = Number(n) || 0;
  return n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + (State.settings.currency || '€');
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return '—';
  return dt.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtDateTime(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return '—';
  return dt.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) + " · " + dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function parseFrenchNumber(value){
  if(typeof value === 'number') return isNaN(value) ? 0 : value;
  return Number(String(value == null ? '' : value).replace(/\s/g, '').replace(',', '.')) || 0;
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function showToast(msg, iconSvg){
  const c = document.getElementById('toast-container');
  if(!c) return;
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = (iconSvg || '<svg class="svg-icon" viewBox="0 0 24 24" style="color:var(--apple-blue);"><path d="M20 6L9 17l-5-5"></path></svg>') +
    '<span>' + escapeHtml(msg) + '</span>';
  c.appendChild(t);
  setTimeout(function(){
    t.style.opacity = '0';
    t.style.transform = 'translateY(-12px) scale(0.96)';
    t.style.transition = 'all 0.24s var(--ease-spring)';
    setTimeout(function(){ t.remove(); }, 250);
  }, 2700);
}

function addHistory(type, title, details, objectId, before, after){
  const userLabel = State.currentUser ? State.currentUser.nom : 'Système';
  State.historique.unshift({
    id: uid(),
    date: new Date().toISOString(),
    user: userLabel,
    type: type,
    title: title,
    details: details || '',
    objectId: objectId || '',
    before: before || null,
    after: after || null
  });
  if(State.historique.length > 1000) State.historique.length = 1000;
  saveHistorique();
}

          { id: uid(), numero: "A2", produit: "", prixVente: 1.50, capacity: 8, qty: 0, image: "", seuilMin: 2 }
        ]},
        { id: uid(), nom: "Étage 2 (Haut)", rayons: [
          { id: uid(), numero: "B1", produit: "", prixVente: 1.50, capacity: 8, qty: 0, image: "", seuilMin: 2 },
          { id: uid(), numero: "B2", produit: "", prixVente: 1.50, capacity: 8, qty: 0, image: "", seuilMin: 2 }

  State.stock = await storeGet('stock', []);
  State.achats = await storeGet('achats', []);
  State.lots = await storeGet('lots', []);
  State.remplissages = await storeGet('remplissages', []);
  State.ajustements = await storeGet('ajustements', []);
  State.historique = await storeGet('historique', []);
  State.profiles = await storeGet('profiles', []);

  updateBadges();
}

async function saveAllNow(){

document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') saveAllNow(); });

/* ==========================================================================
   7. BACKUP / RESTORE ADAPTÉ GITHUB PAGES (HAUTE PERFORMANCE)
   ========================================================================== */
function exportFullBackupJSON(){
  const backupObject = {
    app: "Vezune",
    version: "2.1.0",
    dateExport: new Date().toISOString(),
    profil: State.profil,
    distributeurs: State.distributeurs,
    stock: State.stock,
    achats: State.achats,
    lots: State.lots,
    remplissages: State.remplissages,
    ajustements: State.ajustements,
    historique: State.historique,
    profiles: State.profiles,
    images: State.images,
    settings: State.settings
  };

  const jsonStr = JSON.stringify(backupObject, null, 2);
  const blob = new Blob([jsonStr], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "vezune-backup-" + new Date().toISOString().split('T')[0] + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Sauvegarde exportée");
}

async function restoreFullBackupJSON(jsonStr){
  try {
    const data = JSON.parse(jsonStr);
    if(!data || (!data.distributeurs && !data.stock)){
      alert("Le fichier sélectionné ne semble pas être une sauvegarde Vezune valide.");
      return false;
    }

    if(data.profil) State.profil = data.profil;
    if(Array.isArray(data.distributeurs)) State.distributeurs = data.distributeurs;
    if(Array.isArray(data.stock)) State.stock = data.stock;
    if(Array.isArray(data.achats)) State.achats = data.achats;
    if(Array.isArray(data.lots)) State.lots = data.lots;
    if(Array.isArray(data.remplissages)) State.remplissages = data.remplissages;
    if(Array.isArray(data.ajustements)) State.ajustements = data.ajustements;
    if(Array.isArray(data.historique)) State.historique = data.historique;
    if(Array.isArray(data.profiles)) State.profiles = data.profiles;
    if(Array.isArray(data.images)) State.images = data.images;
    if(data.settings) State.settings = data.settings;

    State.currentDistribId = State.distributeurs[0] ? State.distributeurs[0].id : null;

    await saveAllNow();
    addHistory('config', 'Restauration complète de la sauvegarde effectuée');
    applyTheme();
    updateBadges();
    showToast("Données restaurées");
    renderCurrentTab();
    return true;
  } catch(e){
    console.error(e);
    alert("Erreur lors de la lecture du fichier JSON : " + e.message);
    return false;
  }
}

/* ==========================================================================
   8. CALCULS MÉTIER & ALERTES
   ========================================================================== */
function getCurrentDistrib(){
  if(!State.distributeurs || !State.distributeurs.length) return null;
  const found = State.distributeurs.find(d => d.id === State.currentDistribId);
  return found || State.distributeurs[0];
}

function getProductStock(name){
  if(!name) return null;
  return State.stock.find(s => s.nom.toLowerCase() === String(name).toLowerCase());
}

function getMachineQuantityFor(productName, distribId){
  let total = 0;
  const list = distribId ? State.distributeurs.filter(d => d.id === distribId) : State.distributeurs;
  list.forEach(function(d){
    if(d && d.floors){
      d.floors.forEach(function(f){
        f.rayons.forEach(function(r){
          if(r.produit && r.produit.toLowerCase() === String(productName).toLowerCase()){
            total += Number(r.qty) || 0;
          }
        });
      });
    }
  });
  return total;
}

function getReserveStockFor(productName){
  const st = getProductStock(productName);
  return st ? (Number(st.qty) || 0) : 0;
}

function getTotalStockFor(productName){
  return getReserveStockFor(productName) + (State.settings.includeMachineStock ? getMachineQuantityFor(productName) : 0);
}

function getProductImage(productName, fallback){
  if(fallback) return fallback;
  const st = getProductStock(productName);
  return (st && st.image) ? st.image : '';
}

function getAllConfiguredProducts(){
  const map = new Map();
  State.distributeurs.forEach(function(d){
    if(d.floors){
      d.floors.forEach(function(f){
        f.rayons.forEach(function(r){
          if(!r.produit) return;
          const key = r.produit.toLowerCase();
          if(!map.has(key)){
            map.set(key, {
              nom: r.produit,
              prixVente: r.prixVente || 0,
              image: r.image || getProductImage(r.produit),
              seuilMin: r.seuilMin || 4
            });
          }
        });
      });
    }
  });
  State.stock.forEach(function(s){
    const key = s.nom.toLowerCase();
    if(!map.has(key)){
      map.set(key, {
        nom: s.nom,
        prixVente: s.prixVente || 0,
        image: s.image || '',
        seuilMin: s.seuilMin || 4
      });
    }
  });
  return Array.from(map.values()).sort((a,b) => a.nom.localeCompare(b.nom));
}

function computeAllAlerts(){
  const alerts = [];
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const alertThresholdDays = State.settings.expiryAlertDays || 7;

  // 1. Lots Expiry
  State.lots.forEach(function(lot){
    const remaining = (Number(lot.qtyReserve) || 0) + (Number(lot.qtyMachine) || 0);
    if(!lot.datePeremption || remaining <= 0) return;
    const expDate = new Date(lot.datePeremption);
    const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
    
    let locStr = "Réserve";
    if((lot.qtyMachine || 0) > 0 && (lot.qtyReserve || 0) > 0){
      locStr = "Distributeur & Réserve";
    } else if((lot.qtyMachine || 0) > 0){
      locStr = "En machine";
    }

    if(diffDays < 0){
      alerts.push({
        id: lot.id,
        level: 'red',
        type: 'Produit périmé',
        title: lot.produitNom,
        details: remaining + ' unité(s) périmée(s) depuis le ' + fmtDate(lot.datePeremption),
        where: locStr,
        date: lot.datePeremption,
        lot: lot
      });
    } else if(diffDays <= alertThresholdDays){
      alerts.push({
        id: lot.id,
        level: 'amber',
        type: 'Péremption proche',
        title: lot.produitNom,
        details: remaining + ' unité(s) expirent dans ' + diffDays + ' jour(s) (' + fmtDate(lot.datePeremption) + ')',
        where: locStr,
        date: lot.datePeremption,
        lot: lot
      });
    }
  });

  // 2. Low Stock
  getAllConfiguredProducts().forEach(function(p){
    const st = getProductStock(p.nom);
    const seuil = st ? (Number(st.seuilMin) || 0) : (Number(p.seuilMin) || 0);
    const total = State.settings.includeMachineStock ? getTotalStockFor(p.nom) : getReserveStockFor(p.nom);
    if(seuil > 0 && total < seuil){
      alerts.push({
        id: 'stock_' + p.nom,
        level: total === 0 ? 'red' : 'amber',
        type: total === 0 ? 'Rupture de stock' : 'Stock faible',
        title: p.nom,
        details: 'Stock : ' + total + ' u. · Seuil : ' + seuil + ' u. (Manquant : +' + (seuil - total) + ')',
        where: State.settings.includeMachineStock ? 'Stock global' : 'Réserve',
        productName: p.nom,
        recommended: Math.max(1, seuil - total)
      });
    }
  });

  return alerts.sort((a,b) => (a.level === 'red' ? -1 : 1));
}

function updateBadges(){
  const alerts = computeAllAlerts();
  const redCount = alerts.filter(a => a.level === 'red').length;
  const count = alerts.length;
  
  const sideBadge = document.getElementById('side-badge-alertes');
  const mobBadge = document.getElementById('mob-badge-alertes');
  if(sideBadge){
    if(count > 0){
      sideBadge.style.display = 'inline-block';
      sideBadge.textContent = count;
      sideBadge.className = 'nav-badge ' + (redCount > 0 ? 'pill-red' : 'pill-amber');
    } else {
      sideBadge.style.display = 'none';
    }
  }
  if(mobBadge){
    mobBadge.style.display = count > 0 ? 'block' : 'none';
    mobBadge.style.background = redCount > 0 ? 'var(--apple-red)' : 'var(--apple-orange)';
  }
}

/* ==========================================================================
   9. THÈMES & NAVIGATION
   ========================================================================== */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', State.settings.darkMode ? 'dark' : 'light');
}

function switchTab(tab){
  State.currentTab = tab;
  document.querySelectorAll('.nav-item[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('#mobile-nav button[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderCurrentTab();
  updateBadges();
}

function bindNavigation(){
  document.querySelectorAll('.nav-item[data-tab]').forEach(function(btn){
    btn.addEventListener('click', function(){ switchTab(btn.dataset.tab); });
  });
  document.querySelectorAll('#mobile-nav button[data-tab]').forEach(function(btn){
    btn.addEventListener('click', function(){ switchTab(btn.dataset.tab); });
  });
  document.getElementById('btn-logout').addEventListener('click', doLogout);
}

function renderCurrentTab(){
  const main = document.getElementById('main-area');
  if(!main) return;
  main.innerHTML = "";
  switch(State.currentTab){
    case 'distributeur': renderDistributeurTab(main); break;
    case 'stock': renderStockTab(main); break;
    case 'alertes': renderAlertesTab(main); break;
    case 'compta': renderComptaTab(main); break;
    case 'stats': renderStatsTab(main); break;
    case 'historique': renderHistoriqueTab(main); break;
    case 'parametres': renderParametresTab(main); break;
    default: renderDistributeurTab(main);
  }
}

/* ==========================================================================
   10. MODALES
   ========================================================================== */
function openModal(html, opts){
  opts = opts || {};
  const root = document.getElementById('modal-root');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal ' + (opts.wide ? 'wide' : '') + (opts.full ? ' full' : '') + '">' +
    '<div class="modal-grabber"></div>' +
    html +
  '</div>';
  overlay.addEventListener('mousedown', function(e){ if(e.target === overlay) closeModal(); });
  root.innerHTML = "";
  root.appendChild(overlay);
  return overlay;
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ""; }

/* ==========================================================================

function openImagePickerModal(onSelect){
  const library = getFullImageLibrary();
  let currentCategory = "Tous";
  const categories = ["Tous", "Boissons", "Snacks", "Friandises", "Marque", "Importés"];

  function renderPickerHtml(){
    return '<div class="modal-head"><h3>Bibliothèque d\'images</h3><button class="modal-close" id="imgp-close"><svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div>' +
      '<div class="modal-body">' +
        '<div style="margin-bottom:14px;">' +
          '<div class="seg" id="imgp-categories">' +
            categories.map(c => '<button data-cat="' + c + '" class="' + (c === currentCategory ? 'active' : '') + '">' + c + '</button>').join('') +
          '</div>' +
        '</div>' +
        '<div class="field" style="margin-bottom:14px;">' +
          '<input type="text" id="imgp-search" placeholder="Rechercher une image...">' +
        '</div>' +
        '<div class="img-grid" id="imgp-grid"></div>' +
        '<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border-subtle);">' +
          '<div style="font-weight:800;font-size:12px;margin-bottom:10px;color:var(--text-secondary);text-transform:uppercase;">Importer une image</div>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
            '<label class="btn btn-ghost" style="font-size:13px;padding:9px 15px;cursor:pointer;">' +
              '<svg class="svg-icon" viewBox="0 0 24 24" style="margin-right:6px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>' +
              '<span>Fichier local</span>' +
              '<input type="file" id="imgp-file-input" accept="image/*" style="display:none;">' +
            '</label>' +
            '<button class="btn btn-ghost" id="imgp-url-btn" style="font-size:13px;padding:9px 15px;">' +
              '<svg class="svg-icon" viewBox="0 0 24 24" style="margin-right:6px;"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>' +
              'Lien URL' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="modal-foot"><button class="btn btn-ghost" id="imgp-cancel">Annuler</button></div>';
  }

  const ov = openModal(renderPickerHtml(), { wide: true });

  function populateGrid(query){
    query = (query || '').toLowerCase();
    const grid = ov.querySelector('#imgp-grid');
    const filtered = library.filter(function(img){
      const matchCat = currentCategory === "Tous" || (img.category === currentCategory) || (currentCategory === "Importés" && img.isCustom);
      const matchQuery = img.label.toLowerCase().includes(query) || img.file.toLowerCase().includes(query);
      return matchCat && matchQuery;
    });

    if(!filtered.length){
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:32px;color:var(--text-tertiary);font-size:14px;">Aucune image trouvée.</div>';
      return;
    }

    grid.innerHTML = filtered.map(function(img){
      return '<div class="img-card" data-file="' + escapeHtml(img.file) + '">' +
        '<img class="img-square" src="' + escapeHtml(resolveImageSrc(img.file)) + '" onerror="this.src=\'./logo.png\';">' +
        '<div class="img-name">' + escapeHtml(img.label) + '</div>' +
      '</div>';
    }).join('');

    grid.querySelectorAll('.img-card').forEach(function(card){
      card.addEventListener('click', function(){
        const selectedFile = card.dataset.file;
        closeModal();
        if(typeof onSelect === 'function') onSelect(selectedFile);
      });
    });
  }

  populateGrid();

  ov.querySelector('#imgp-close').addEventListener('click', closeModal);
  ov.querySelector('#imgp-cancel').addEventListener('click', closeModal);
  ov.querySelector('#imgp-search').addEventListener('input', function(e){ populateGrid(e.target.value); });

  ov.querySelectorAll('#imgp-categories button').forEach(function(b){
    b.addEventListener('click', function(){
      currentCategory = b.dataset.cat;
      ov.querySelectorAll('#imgp-categories button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      populateGrid(ov.querySelector('#imgp-search').value);
    });
  });

  ov.querySelector('#imgp-file-input').addEventListener('change', function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async function(evt){
      const dataUrl = evt.target.result;
      const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const newImg = { file: 'custom_' + Date.now() + '_' + cleanName, label: file.name.split('.')[0], category: 'Importés', isCustom: true, dataUrl: dataUrl };
      State.images.push(newImg);
      await saveImages();
      showToast("Image importée");
      closeModal();
      if(typeof onSelect === 'function') onSelect(newImg.file);
    };
    reader.readAsDataURL(file);
  });

  ov.querySelector('#imgp-url-btn').addEventListener('click', async function(){
    const url = prompt("Entrez l'URL de l'image :");
    if(!url || !url.trim()) return;
    const label = prompt("Nom de l'article :") || "Image";
    const newImg = { file: url.trim(), label: label.trim(), category: 'Importés', isCustom: true, dataUrl: url.trim() };
    State.images.push(newImg);
    await saveImages();
    showToast("Image enregistrée");
    closeModal();
    if(typeof onSelect === 'function') onSelect(newImg.file);
  });
}

function renderPeremptionBadge(dateStr){
  if(!dateStr) return '<span class="pill pill-gray">—</span>';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const exp = new Date(dateStr);
  const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
  if(diffDays < 0) return '<span class="pill pill-red">Périmé (' + fmtDate(dateStr) + ')</span>';
  if(diffDays <= 7) return '<span class="pill pill-amber">Dans ' + diffDays + ' j (' + fmtDate(dateStr) + ')</span>';
  return '<span class="pill pill-green">' + fmtDate(dateStr) + '</span>';
}
