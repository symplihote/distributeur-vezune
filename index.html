  const ov = openModal(renderConfigHtml(), { full: true });

  function renderFloorEditors(){
    const list = ov.querySelector('#cfg-floors-list');
    list.innerHTML = tempFloors.map(function(f, fi){
      return '<div class="card" style="margin-bottom:14px;background:rgba(120,120,128,0.06);">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">' +
          '<input type="text" value="' + escapeHtml(f.nom) + '" data-fi="' + fi + '" class="cfg-fname field" style="margin-bottom:0;width:60%;font-weight:800;font-size:15px;">' +
          '<button class="icon-btn danger" data-fi="' + fi + '" data-action="del-floor"><svg class="svg-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px;">' +
          f.rayons.map(function(r, ri){
            return '<div style="display:grid;grid-template-columns:1fr 2fr 1.2fr 1fr 1fr auto;gap:8px;align-items:center;background:var(--bg-secondary);padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);">' +
              '<div><label style="font-size:10px;font-weight:700;color:var(--text-secondary);">RAYON</label><input type="text" value="' + escapeHtml(r.numero) + '" data-fi="' + fi + '" data-ri="' + ri + '" data-field="numero" class="cfg-rfield" style="width:100%;padding:8px;border-radius:8px;font-weight:800;"></div>' +
              '<div><label style="font-size:10px;font-weight:700;color:var(--text-secondary);">PRODUIT</label><input type="text" value="' + escapeHtml(r.produit) + '" data-fi="' + fi + '" data-ri="' + ri + '" data-field="produit" class="cfg-rfield" style="width:100%;padding:8px;border-radius:8px;font-weight:700;"></div>' +
              '<div><label style="font-size:10px;font-weight:700;color:var(--text-secondary);">PRIX VENTE</label><input type="text" inputmode="decimal" value="' + String(r.prixVente || 0).replace('.', ',') + '" data-fi="' + fi + '" data-ri="' + ri + '" data-field="prixVente" class="cfg-rfield" style="width:100%;padding:8px;border-radius:8px;font-weight:800;"></div>' +
              '<div><label style="font-size:10px;font-weight:700;color:var(--text-secondary);">CAPACITÉ</label><input type="number" inputmode="numeric" value="' + (r.capacity || 8) + '" data-fi="' + fi + '" data-ri="' + ri + '" data-field="capacity" class="cfg-rfield" style="width:100%;padding:8px;border-radius:8px;"></div>' +
              '<div><label style="font-size:10px;font-weight:700;color:var(--text-secondary);">IMAGE</label><button class="btn btn-ghost cfg-img-pick-btn" data-fi="' + fi + '" data-ri="' + ri + '" style="padding:6px 10px;font-size:11px;width:100%;">' + (r.image ? 'Image OK' : 'Choisir') + '</button></div>' +
              '<button class="icon-btn danger" data-fi="' + fi + '" data-ri="' + ri + '" data-action="del-rayon" style="width:32px;height:32px;"><svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>' +
            '</div>';
          }).join('') +
        '</div>' +
        '<button class="btn btn-soft-blue" data-fi="' + fi + '" data-action="add-rayon" style="margin-top:10px;padding:8px 14px;font-size:13px;">+ Ajouter un rayon à cet étage</button>' +
      '</div>';
    }).join('');

    list.querySelectorAll('.cfg-fname').forEach(inp => {
      inp.addEventListener('input', () => { tempFloors[+inp.dataset.fi].nom = inp.value; });
    });
    list.querySelectorAll('.cfg-rfield').forEach(inp => {
      inp.addEventListener('input', () => {
        const r = tempFloors[+inp.dataset.fi].rayons[+inp.dataset.ri];
        const field = inp.dataset.field;
        if(field === 'prixVente') r[field] = parseFrenchNumber(inp.value);
        else if(field === 'capacity' || field === 'seuilMin') r[field] = parseInt(inp.value) || 0;
        else r[field] = inp.value;
      });
    });

    list.querySelectorAll('.cfg-img-pick-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const fi = +btn.dataset.fi;
        const ri = +btn.dataset.ri;
        openImagePickerModal(function(selectedFile){
          tempFloors[fi].rayons[ri].image = selectedFile;
          renderFloorEditors();
        });
      });
    });

    list.querySelectorAll('[data-action="add-rayon"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const f = tempFloors[+btn.dataset.fi];
        const num = String.fromCharCode(65 + f.rayons.length) + (f.rayons.length + 1);
        f.rayons.push({ id: uid(), numero: num, produit: "", prixVente: 1.50, capacity: 8, qty: 0, image: "", seuilMin: 2 });
        renderFloorEditors();
      });
    });

    list.querySelectorAll('[data-action="del-rayon"]').forEach(btn => {
      btn.addEventListener('click', () => {
        tempFloors[+btn.dataset.fi].rayons.splice(+btn.dataset.ri, 1);
        renderFloorEditors();
      });
    });

    list.querySelectorAll('[data-action="del-floor"]').forEach(btn => {
      btn.addEventListener('click', () => {
        if(confirm("Supprimer cet étage et tous ses rayons ?")){
          tempFloors.splice(+btn.dataset.fi, 1);
          renderFloorEditors();
        }
      });
    });
  }

  renderFloorEditors();

  ov.querySelector('#cfg-add-floor').addEventListener('click', () => {
    tempFloors.push({ id: uid(), nom: "Étage " + (tempFloors.length + 1), rayons: [] });
    renderFloorEditors();
  });

  ov.querySelector('#cfg-close').addEventListener('click', closeModal);
  ov.querySelector('#cfg-cancel').addEventListener('click', closeModal);
  ov.querySelector('#cfg-save').addEventListener('click', async () => {
    distrib.nom = ov.querySelector('#cfg-distrib-nom').value.trim() || distrib.nom;
    distrib.floors = tempFloors;
    await saveDistribs();
    addHistory('config', 'Configuration mise à jour', distrib.nom + ' (' + distrib.floors.length + ' étages)');
    showToast("Configuration enregistrée");
    closeModal();
    renderCurrentTab();
  });
}

/* ==========================================================================
   15. ASSISTANT DE REMPLISSAGE DU DISTRIBUTEUR (DU BAS VERS LE HAUT)
   ========================================================================== */
function openRestockingWizard(distrib, targetFloorId){
  if(!distrib || !distrib.floors || !distrib.floors.length){
    alert("Veuillez d'abord configurer des étages et des rayons.");
    return;
  }

  const allSlots = [];
  const floors = targetFloorId ? distrib.floors.filter(f => f.id === targetFloorId) : distrib.floors.slice();
  
  floors.forEach(function(f, fIdx){
    f.rayons.forEach(function(r, rIdx){
      if(!r.produit) return;
      allSlots.push({
        floor: f,
        rayon: r,
        floorIndex: fIdx,
        rayonIndex: rIdx,
        initialQty: Number(r.qty) || 0,
        restant: Number(r.qty) || 0,
        ajoute: 0,
        vendu: 0
      });
    });
  });

  if(!allSlots.length){
    alert("Aucun produit configuré dans ce distributeur.");
    return;
  }

  let currentSlotIdx = 0;
  let currentSubStep = 1;

  function renderWizardView(){
    if(currentSlotIdx >= allSlots.length){
      renderSummaryView();
      return;
    }

    const item = allSlots[currentSlotIdx];
    const r = item.rayon;
    const f = item.floor;
    const st = getProductStock(r.produit);
    const reserveStock = st ? (Number(st.qty) || 0) : 0;
    const cap = Number(r.capacity) || 8;
    const progressPct = Math.round(((currentSlotIdx) / allSlots.length) * 100);
    const imgSrc = resolveImageSrc(getProductImage(r.produit, r.image));

    let bodyHtml = '';
    if(currentSubStep === 1){
      bodyHtml =
        '<div class="wizard-question">Combien reste-t-il actuellement ?</div>' +
        '<p style="color:var(--text-secondary);font-size:14px;margin-top:0;">Comptez les articles physiques restants dans le rayon <strong>' + escapeHtml(r.numero) + '</strong>.</p>' +
        '<div class="big-input-wrap">' +
          '<button class="big-stepper-btn" id="wz-dec-rest">-</button>' +
          '<input type="number" inputmode="numeric" id="wz-input-rest" class="big-input num" value="' + item.restant + '" min="0" max="' + cap + '">' +
          '<button class="big-stepper-btn" id="wz-inc-rest">+</button>' +
        '</div>' +
        '<div class="chips-row" style="justify-content:center;">' +
          '<button class="chip-choice" data-set-rest="0">0 (Vide)</button>' +
          '<button class="chip-choice" data-set-rest="' + item.initialQty + '">Inchangé (' + item.initialQty + ')</button>' +
          '<button class="chip-choice" data-set-rest="' + cap + '">Plein (' + cap + ')</button>' +
        '</div>' +
        '<div style="text-align:center;margin-top:24px;">' +
          '<button class="btn btn-primary btn-lg" id="wz-next-sub" style="width:100%;max-width:320px;">' +
            'Continuer vers l\'ajout →' +
          '</button>' +
        '</div>';
    } else {
      const maxPossibleAdd = Math.min(reserveStock, Math.max(0, cap - item.restant));
      bodyHtml =
        '<div class="wizard-question">Combien ajoutes-tu depuis la réserve ?</div>' +
        '<div style="background:var(--apple-blue-soft);padding:12px 16px;border-radius:var(--radius-sm);font-size:14px;color:var(--apple-blue);font-weight:700;margin-bottom:16px;">' +
          'Stock disponible en réserve : <strong>' + reserveStock + ' unités</strong> · Capacité libre : <strong>' + (cap - item.restant) + ' u.</strong>' +
        '</div>' +
        '<div class="big-input-wrap">' +
          '<button class="big-stepper-btn" id="wz-dec-add">-</button>' +
          '<input type="number" inputmode="numeric" id="wz-input-add" class="big-input num" value="' + item.ajoute + '" min="0" max="' + reserveStock + '">' +
          '<button class="big-stepper-btn" id="wz-inc-add">+</button>' +
        '</div>' +
        '<div class="chips-row" style="justify-content:center;">' +
          '<button class="chip-choice" data-set-add="0">+0</button>' +
          '<button class="chip-choice" data-set-add="' + maxPossibleAdd + '">Remplir au max (+' + maxPossibleAdd + ')</button>' +
        '</div>' +
        '<div id="wz-err" class="err-msg" style="text-align:center;"></div>' +
        '<div style="display:flex;gap:10px;justify-content:center;margin-top:24px;">' +
          '<button class="btn btn-ghost" id="wz-back-sub" style="padding:14px 20px;">← Retour</button>' +
          '<button class="btn btn-primary btn-lg" id="wz-next-slot" style="flex:1;max-width:260px;">' +
            'Valider ce rayon →' +
          '</button>' +
        '</div>';
    }

    const html =
      '<div class="modal-head">' +
        '<div>' +
          '<div class="wizard-step-title">Rayon ' + (currentSlotIdx + 1) + ' sur ' + allSlots.length + ' · ' + escapeHtml(f.nom) + '</div>' +
          '<h3 style="margin:2px 0 0;">Rayon ' + escapeHtml(r.numero) + ' : ' + escapeHtml(r.produit) + '</h3>' +
        '</div>' +
        '<button class="modal-close" id="wz-close"><svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<div class="wizard-progress">' +
          '<div class="wizard-progress-bar"><div class="wizard-progress-fill" style="width:' + progressPct + '%;"></div></div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:14px;background:var(--bg-secondary);padding:14px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);margin-bottom:18px;">' +
          (imgSrc ? '<div style="width:54px;height:54px;aspect-ratio:1/1;border-radius:12px;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;padding:4px;"><img src="' + escapeHtml(imgSrc) + '" style="width:100%;height:100%;object-fit:contain;"></div>' : '') +
          '<div>' +
            '<div style="font-weight:800;font-size:17px;">' + escapeHtml(r.produit) + '</div>' +
            '<div style="font-size:13px;color:var(--text-secondary);">Prix : ' + fmtMoney(r.prixVente) + ' · Capacité : ' + cap + ' u.</div>' +
          '</div>' +
        '</div>' +
        bodyHtml +
      '</div>';

    const modal = ov.querySelector('.modal');
    modal.innerHTML = '<div class="modal-grabber"></div>' + html;

    if(currentSubStep === 1){
      const inp = modal.querySelector('#wz-input-rest');
      modal.querySelector('#wz-dec-rest').addEventListener('click', () => { inp.value = Math.max(0, parseInt(inp.value||0) - 1); });
      modal.querySelector('#wz-inc-rest').addEventListener('click', () => { inp.value = Math.min(cap, parseInt(inp.value||0) + 1); });
      modal.querySelectorAll('[data-set-rest]').forEach(btn => {
        btn.addEventListener('click', () => { inp.value = btn.dataset.setRest; });
      });
      modal.querySelector('#wz-next-sub').addEventListener('click', () => {
        item.restant = Math.max(0, Math.min(cap, parseInt(inp.value) || 0));
        item.vendu = Math.max(0, item.initialQty - item.restant);
        const missing = Math.max(0, cap - item.restant);
        item.ajoute = Math.min(reserveStock, missing);
        currentSubStep = 2;
        renderWizardView();
      });
    } else {
      const inp = modal.querySelector('#wz-input-add');
      const err = modal.querySelector('#wz-err');
      modal.querySelector('#wz-dec-add').addEventListener('click', () => { inp.value = Math.max(0, parseInt(inp.value||0) - 1); err.textContent = ""; });
      modal.querySelector('#wz-inc-add').addEventListener('click', () => { inp.value = parseInt(inp.value||0) + 1; err.textContent = ""; });
      modal.querySelectorAll('[data-set-add]').forEach(btn => {
        btn.addEventListener('click', () => { inp.value = btn.dataset.setAdd; err.textContent = ""; });
      });
      modal.querySelector('#wz-back-sub').addEventListener('click', () => {
        currentSubStep = 1;
        renderWizardView();
      });
      modal.querySelector('#wz-next-slot').addEventListener('click', () => {
        const addVal = parseInt(inp.value) || 0;
        if(addVal < 0){ err.textContent = "La quantité ajoutée doit être positive."; return; }
        if(addVal > reserveStock){
          err.textContent = "Stock insuffisant : Vous avez " + reserveStock + " en réserve mais essayez d'en ajouter " + addVal + ".";
          return;
        }
        if(item.restant + addVal > cap){
          err.textContent = "Capacité dépassée : Le rayon peut contenir au maximum " + cap + " unités (" + item.restant + " + " + addVal + " = " + (item.restant + addVal) + ").";
          return;
        }
        item.ajoute = addVal;
        currentSlotIdx++;
        currentSubStep = 1;
        renderWizardView();
      });
    }

    modal.querySelector('#wz-close').addEventListener('click', () => {
      if(confirm("Quitter l'assistant de remplissage ?")){
        closeModal();
      }
    });
  }

  function renderSummaryView(){
    let totalAjoute = 0;
    let totalVendu = 0;
    let totalMontantVentes = 0;
    let totalCoutVentes = 0;

    const lignes = allSlots.map(function(s){
      const st = getProductStock(s.rayon.produit);
      const prixAchat = st ? st.prixAchat : 0;
      const prixVente = s.rayon.prixVente || 0;
      const finalQty = s.restant + s.ajoute;
      totalAjoute += s.ajoute;
      totalVendu += s.vendu;
      totalMontantVentes += (s.vendu * prixVente);
      totalCoutVentes += (s.vendu * prixAchat);

      return {
        floorNom: s.floor.nom,
        rayonNumero: s.rayon.numero,
        produitNom: s.rayon.produit,
        initial: s.initialQty,
        restant: s.restant,
        ajoute: s.ajoute,
        vendu: s.vendu,
        finalQty: finalQty,
        prixVente: prixVente,
        prixAchat: prixAchat,
        slotRef: s
      };
    });

    const totalBenefice = totalMontantVentes - totalCoutVentes;

    const html =
      '<div class="modal-head">' +
        '<h3>Résumé du remplissage</h3>' +
        '<button class="modal-close" id="wz-close"><svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<div class="grid g3" style="margin-bottom:18px;">' +
          '<div class="card stat-card"><div class="label">Total ajouté</div><div class="value num" style="color:var(--apple-blue);">+' + totalAjoute + ' u.</div><div class="delta">Depuis la réserve</div></div>' +
          '<div class="card stat-card"><div class="label">Ventes estimées</div><div class="value num" style="color:var(--apple-green);">' + totalVendu + ' u.</div><div class="delta">CA : ' + fmtMoney(totalMontantVentes) + '</div></div>' +
          '<div class="card stat-card"><div class="label">Bénéfice estimé</div><div class="value num" style="color:var(--apple-green);">' + fmtMoney(totalBenefice) + '</div><div class="delta">Marge brute</div></div>' +
        '</div>' +
        '<div class="card" style="padding:0;overflow:hidden;">' +
          '<div class="table-wrap"><table>' +
            '<thead><tr><th>Rayon</th><th>Produit</th><th>Restant</th><th>Ajouté</th><th>Nouveau total</th><th>Vendus</th></tr></thead>' +
            '<tbody>' +
              lignes.map(l => '<tr>' +
                '<td><strong>' + escapeHtml(l.rayonNumero) + '</strong> <small style="color:var(--text-secondary);">' + escapeHtml(l.floorNom) + '</small></td>' +
                '<td>' + escapeHtml(l.produitNom) + '</td>' +
                '<td class="num">' + l.restant + '</td>' +
                '<td class="num" style="color:var(--apple-blue);font-weight:700;">+' + l.ajoute + '</td>' +
                '<td class="num"><strong>' + l.finalQty + '</strong></td>' +
                '<td class="num" style="color:var(--apple-green);font-weight:700;">' + (l.vendu > 0 ? l.vendu + ' u.' : '—') + '</td>' +
              '</tr>').join('') +
            '</tbody>' +
          '</table></div>' +
        '</div>' +
      '</div>' +
      '<div class="modal-foot">' +
        '<button class="btn btn-ghost" id="wz-cancel">Annuler</button>' +
        '<button class="btn btn-primary btn-lg" id="wz-confirm-btn" style="flex:1;max-width:320px;">Confirmer le remplissage</button>' +
      '</div>';

    const modal = ov.querySelector('.modal');
    modal.innerHTML = '<div class="modal-grabber"></div>' + html;

    modal.querySelector('#wz-close').addEventListener('click', closeModal);
    modal.querySelector('#wz-cancel').addEventListener('click', closeModal);
    modal.querySelector('#wz-confirm-btn').addEventListener('click', async () => {
      lignes.forEach(function(l){
        l.slotRef.rayon.qty = l.finalQty;
        const st = getProductStock(l.produitNom);
        if(st && l.ajoute > 0){
          st.qty = Math.max(0, st.qty - l.ajoute);
          st.dateMaj = new Date().toISOString();
        }

        if(l.ajoute > 0){
          let remainingToAdd = l.ajoute;
          const matchingLots = State.lots.filter(lot => lot.produitNom && lot.produitNom.toLowerCase() === l.produitNom.toLowerCase() && (lot.qtyReserve || 0) > 0);
          matchingLots.sort((a,b) => (a.datePeremption || '9999').localeCompare(b.datePeremption || '9999'));
          matchingLots.forEach(function(lot){
            if(remainingToAdd <= 0) return;
            const take = Math.min(remainingToAdd, lot.qtyReserve);
            lot.qtyReserve -= take;
            lot.qtyMachine = (lot.qtyMachine || 0) + take;
            remainingToAdd -= take;
          });
        }
      });

      const refillEntry = {
        id: uid(),
        date: new Date().toISOString(),
        utilisateur: State.currentUser ? State.currentUser.nom : 'Admin',
        distributeurId: distrib.id,
        distributeurNom: distrib.nom,
        lignes: lignes.map(l => ({
          floorNom: l.floorNom,
          rayonNumero: l.rayonNumero,
          produitNom: l.produitNom,
          qtyRestant: l.restant,
          qtyAjoutee: l.ajoute,
          qtyVendu: l.vendu,
          prixVente: l.prixVente,
          prixAchat: l.prixAchat,
          montantVente: +(l.vendu * l.prixVente).toFixed(2),
          coutVendu: +(l.vendu * l.prixAchat).toFixed(2)
        })),
        totalAjoute: totalAjoute,
        totalVendu: totalVendu,
        totalMontant: +totalMontantVentes.toFixed(2),
        totalCout: +totalCoutVentes.toFixed(2),
        totalBenefice: +totalBenefice.toFixed(2)
      };

      State.remplissages.unshift(refillEntry);
      addHistory('remplissage', 'Remplissage effectué — ' + distrib.nom, totalAjoute + ' unités ajoutées · ' + totalVendu + ' ventes constatées (' + fmtMoney(totalMontantVentes) + ')');

      await saveDistribs();
      await saveStock();
      await saveLots();
      await saveRemplissages();

      showToast("Remplissage validé et synchronisé");
      closeModal();
      renderCurrentTab();
    });
  }

  const ov = openModal('', { wide: true });
  renderWizardView();
}

/* ==========================================================================
   16. ASSISTANT DE COURSES & ACHATS (7 ÉTAPES)
   ========================================================================== */
function openShoppingWizard(preselectedProductName){
  let currentStep = 1;
  const totalSteps = 7;
  const configuredProds = getAllConfiguredProducts();

  const purchaseData = {
    produitNom: preselectedProductName || (configuredProds[0] ? configuredProds[0].nom : ''),
    unitesParPack: 6,
    nbPacks: 3,
    prixPack: 4.00,
    prixVenteSuggere: 1.50,
    datePeremption: '',
    image: ''
  };

  if(preselectedProductName){
    const st = getProductStock(preselectedProductName);
    if(st){
      purchaseData.prixVenteSuggere = st.prixVente || 1.50;
      purchaseData.image = st.image || '';
    }
  }

  function renderStepHtml(){
    const progress = Math.round(((currentStep - 1) / (totalSteps - 1)) * 100);
    let stepContent = '';

    switch(currentStep){
      case 1:
        stepContent =
          '<div class="wizard-question">Quel produit as-tu acheté ?</div>' +
          '<div class="field" style="margin-bottom:14px;"><input type="text" id="wz-prod-search" placeholder="Rechercher ou saisir un produit..." value="' + escapeHtml(purchaseData.produitNom) + '"></div>' +
          '<div class="chips-row" id="wz-prod-chips" style="max-height:220px;overflow-y:auto;">' +
            configuredProds.map(p => '<button class="chip-choice' + (p.nom.toLowerCase() === purchaseData.produitNom.toLowerCase() ? ' active' : '') + '" data-pname="' + escapeHtml(p.nom) + '">' + escapeHtml(p.nom) + '</button>').join('') +
          '</div>';
        break;

      case 2:
        stepContent =
          '<div class="wizard-question">Combien d\'articles contient 1 pack ?</div>' +
          '<p style="color:var(--text-secondary);font-size:14px;margin-top:0;">Exemple : 6 pour un pack de 6 canettes, 24 pour un carton.</p>' +
          '<div class="big-input-wrap">' +
            '<button class="big-stepper-btn" id="wz-dec-upp">-</button>' +
            '<input type="number" inputmode="numeric" id="wz-input-upp" class="big-input num" value="' + purchaseData.unitesParPack + '" min="1">' +
            '<button class="big-stepper-btn" id="wz-inc-upp">+</button>' +
          '</div>' +
          '<div class="chips-row" style="justify-content:center;">' +
            [1, 4, 6, 8, 12, 24].map(n => '<button class="chip-choice' + (purchaseData.unitesParPack === n ? ' active' : '') + '" data-set-upp="' + n + '">' + n + ' unités</button>').join('') +
          '</div>';
        break;

      case 3:
        stepContent =
          '<div class="wizard-question">Combien de packs as-tu achetés ?</div>' +
          '<div class="big-input-wrap">' +
            '<button class="big-stepper-btn" id="wz-dec-np">-</button>' +
            '<input type="number" inputmode="numeric" id="wz-input-np" class="big-input num" value="' + purchaseData.nbPacks + '" min="1">' +
            '<button class="big-stepper-btn" id="wz-inc-np">+</button>' +
          '</div>' +
          '<div class="chips-row" style="justify-content:center;">' +
            [1, 2, 3, 4, 5, 10].map(n => '<button class="chip-choice' + (purchaseData.nbPacks === n ? ' active' : '') + '" data-set-np="' + n + '">' + n + ' pack(s)</button>').join('') +
          '</div>';
        break;

      case 4:
        stepContent =
          '<div class="wizard-question">Quel était le prix d\'un pack ?</div>' +
          '<p style="color:var(--text-secondary);font-size:14px;margin-top:0;">Prix TTC payé pour 1 pack (en €).</p>' +
          '<div class="big-input-wrap">' +
            '<input type="text" inputmode="decimal" id="wz-input-pp" class="big-input num" value="' + String(purchaseData.prixPack).replace('.', ',') + '" style="width:200px;">' +
          '</div>' +
          '<div class="chips-row" style="justify-content:center;">' +
            ['2,50', '3,00', '3,90', '4,20', '4,50', '6,00'].map(p => '<button class="chip-choice" data-set-pp="' + p + '">' + p + ' €</button>').join('') +
          '</div>';
        break;

      case 5:
        stepContent =
          '<div class="wizard-question">Quelle est la date de péremption ?</div>' +
          '<p style="color:var(--text-secondary);font-size:14px;margin-top:0;">Permet d\'assurer la traçabilité de ce lot.</p>' +
          '<div class="field" style="max-width:300px;margin:20px auto;">' +
            '<input type="date" id="wz-input-exp" value="' + escapeHtml(purchaseData.datePeremption) + '" style="padding:14px;font-size:16px;border-radius:14px;">' +
          '</div>' +
          '<div class="chips-row" style="justify-content:center;">' +
            '<button class="chip-choice" data-add-months="3">+3 mois</button>' +
            '<button class="chip-choice" data-add-months="6">+6 mois</button>' +
            '<button class="chip-choice" data-add-months="12">+1 an</button>' +
            '<button class="chip-choice" data-set-noexp="1">Sans date</button>' +
          '</div>';
        break;

      case 6:
        stepContent =
          '<div class="wizard-question">Prix de revente au distributeur</div>' +
          '<p style="color:var(--text-secondary);font-size:14px;margin-top:0;">Prix unitaire payé par le client.</p>' +
          '<div class="big-input-wrap">' +
            '<input type="text" inputmode="decimal" id="wz-input-pv" class="big-input num" value="' + String(purchaseData.prixVenteSuggere).replace('.', ',') + '" style="width:190px;">' +
          '</div>' +
          '<div class="chips-row" style="justify-content:center;">' +
            ['1,00', '1,20', '1,50', '1,80', '2,00'].map(p => '<button class="chip-choice" data-set-pv="' + p + '">' + p + ' €</button>').join('') +
          '</div>';
        break;

      case 7:
        const totalUnits = purchaseData.unitesParPack * purchaseData.nbPacks;
        const totalCost = +(purchaseData.prixPack * purchaseData.nbPacks).toFixed(2);
        const unitCost = totalUnits > 0 ? +(totalCost / totalUnits).toFixed(3) : 0;
        const unitMargin = +(purchaseData.prixVenteSuggere - unitCost).toFixed(2);
        const marginPct = purchaseData.prixVenteSuggere > 0 ? Math.round((unitMargin / purchaseData.prixVenteSuggere) * 100) : 0;

        stepContent =
          '<div class="wizard-question" style="color:var(--apple-green);">Calculs automatiques</div>' +
          '<div class="grid g2" style="margin-bottom:16px;">' +
            '<div class="card stat-card"><div class="label">Articles ajoutés</div><div class="value num" style="color:var(--apple-blue);">' + totalUnits + ' unités</div><div class="delta">' + purchaseData.nbPacks + ' packs × ' + purchaseData.unitesParPack + ' u.</div></div>' +
            '<div class="card stat-card"><div class="label">Coût total achat</div><div class="value num" style="color:var(--apple-red);">' + fmtMoney(totalCost) + '</div><div class="delta">' + purchaseData.nbPacks + ' × ' + fmtMoney(purchaseData.prixPack) + '</div></div>' +
            '<div class="card stat-card"><div class="label">Coût d\'achat unitaire</div><div class="value num">' + fmtMoney(unitCost) + ' / u.</div><div class="delta">Calcul automatique</div></div>' +
            '<div class="card stat-card"><div class="label">Marge unitaire brute</div><div class="value num" style="color:var(--apple-green);">' + fmtMoney(unitMargin) + ' <small>(' + marginPct + '%)</small></div><div class="delta">Revente : ' + fmtMoney(purchaseData.prixVenteSuggere) + '</div></div>' +
          '</div>' +
          '<div class="card" style="padding:14px;margin-bottom:14px;">' +
            '<div style="font-size:14px;">Produit : <strong>' + escapeHtml(purchaseData.produitNom) + '</strong></div>' +
            '<div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">Date limite : <strong>' + (purchaseData.datePeremption ? fmtDate(purchaseData.datePeremption) : 'Non spécifiée') + '</strong></div>' +
          '</div>';
        break;
    }

    const html =
      '<div class="modal-head">' +
        '<div>' +
          '<div class="wizard-step-title">Étape ' + currentStep + ' sur ' + totalSteps + '</div>' +
          '<h3 style="margin:2px 0 0;">Enregistrer une course</h3>' +
        '</div>' +
        '<button class="modal-close" id="wzc-close"><svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<div class="wizard-progress">' +
          '<div class="wizard-progress-bar"><div class="wizard-progress-fill" style="width:' + progress + '%;"></div></div>' +
        '</div>' +
        stepContent +
        '<div id="wzc-err" class="err-msg" style="text-align:center;"></div>' +
      '</div>' +
      '<div class="modal-foot">' +
        (currentStep > 1 ? '<button class="btn btn-ghost" id="wzc-prev">← Précédent</button>' : '<button class="btn btn-ghost" id="wzc-cancel">Annuler</button>') +
        (currentStep < totalSteps ? '<button class="btn btn-primary" id="wzc-next">Suivant →</button>' : '<button class="btn btn-primary btn-lg" id="wzc-confirm">Confirmer l\'achat</button>') +
      '</div>';

    const modal = ov.querySelector('.modal');
    modal.innerHTML = '<div class="modal-grabber"></div>' + html;

    modal.querySelector('#wzc-close').addEventListener('click', closeModal);
    const cancelBtn = modal.querySelector('#wzc-cancel');
    if(cancelBtn) cancelBtn.addEventListener('click', closeModal);

    const prevBtn = modal.querySelector('#wzc-prev');
    if(prevBtn) prevBtn.addEventListener('click', () => { currentStep--; renderStepHtml(); });

    const nextBtn = modal.querySelector('#wzc-next');
    if(nextBtn) nextBtn.addEventListener('click', () => {
      const err = modal.querySelector('#wzc-err');
      if(currentStep === 1){
        const val = modal.querySelector('#wz-prod-search').value.trim();
        if(!val){ err.textContent = "Veuillez saisir ou choisir un produit."; return; }
        purchaseData.produitNom = val;
      } else if(currentStep === 2){
        const val = parseInt(modal.querySelector('#wz-input-upp').value) || 0;
        if(val <= 0){ err.textContent = "Le nombre d'unités doit être au moins 1."; return; }
        purchaseData.unitesParPack = val;
      } else if(currentStep === 3){
        const val = parseInt(modal.querySelector('#wz-input-np').value) || 0;
        if(val <= 0){ err.textContent = "Le nombre de packs doit être au moins 1."; return; }
        purchaseData.nbPacks = val;
      } else if(currentStep === 4){
        const val = parseFrenchNumber(modal.querySelector('#wz-input-pp').value);
        if(val <= 0){ err.textContent = "Veuillez renseigner un prix de pack valide."; return; }
        purchaseData.prixPack = val;
      } else if(currentStep === 5){
        purchaseData.datePeremption = modal.querySelector('#wz-input-exp').value;
      } else if(currentStep === 6){
        const val = parseFrenchNumber(modal.querySelector('#wz-input-pv').value);
        if(val <= 0){ err.textContent = "Veuillez renseigner un prix de vente valide."; return; }
        purchaseData.prixVenteSuggere = val;
      }
      currentStep++;
      renderStepHtml();
    });

    if(currentStep === 1){
      modal.querySelectorAll('#wz-prod-chips button').forEach(btn => {
        btn.addEventListener('click', () => {
          purchaseData.produitNom = btn.dataset.pname;
          modal.querySelector('#wz-prod-search').value = purchaseData.produitNom;
          modal.querySelectorAll('#wz-prod-chips button').forEach(x => x.classList.remove('active'));
          btn.classList.add('active');
        });
      });
    } else if(currentStep === 2){
      const inp = modal.querySelector('#wz-input-upp');
      modal.querySelector('#wz-dec-upp').addEventListener('click', () => { inp.value = Math.max(1, parseInt(inp.value||1) - 1); });
      modal.querySelector('#wz-inc-upp').addEventListener('click', () => { inp.value = parseInt(inp.value||1) + 1; });
      modal.querySelectorAll('[data-set-upp]').forEach(btn => {
        btn.addEventListener('click', () => { inp.value = btn.dataset.setUpp; });
      });
    } else if(currentStep === 3){
      const inp = modal.querySelector('#wz-input-np');
      modal.querySelector('#wz-dec-np').addEventListener('click', () => { inp.value = Math.max(1, parseInt(inp.value||1) - 1); });
      modal.querySelector('#wz-inc-np').addEventListener('click', () => { inp.value = parseInt(inp.value||1) + 1; });
      modal.querySelectorAll('[data-set-np]').forEach(btn => {
        btn.addEventListener('click', () => { inp.value = btn.dataset.setNp; });
      });
    } else if(currentStep === 4){
      modal.querySelectorAll('[data-set-pp]').forEach(btn => {
        btn.addEventListener('click', () => { modal.querySelector('#wz-input-pp').value = btn.dataset.setPp; });
      });
    } else if(currentStep === 5){
      modal.querySelectorAll('[data-add-months]').forEach(btn => {
        btn.addEventListener('click', () => {
          const d = new Date();
          d.setMonth(d.getMonth() + parseInt(btn.dataset.addMonths));
          modal.querySelector('#wz-input-exp').value = d.toISOString().split('T')[0];
        });
      });
      const noExpBtn = modal.querySelector('[data-set-noexp]');
      if(noExpBtn) noExpBtn.addEventListener('click', () => { modal.querySelector('#wz-input-exp').value = ''; });
    } else if(currentStep === 6){
      modal.querySelectorAll('[data-set-pv]').forEach(btn => {
        btn.addEventListener('click', () => { modal.querySelector('#wz-input-pv').value = btn.dataset.setPv; });
      });
    } else if(currentStep === 7){
      modal.querySelector('#wzc-confirm').addEventListener('click', async () => {
        const totalUnits = purchaseData.unitesParPack * purchaseData.nbPacks;
        const totalCost = +(purchaseData.prixPack * purchaseData.nbPacks).toFixed(2);
        const unitCost = +(totalCost / totalUnits).toFixed(3);
        const now = new Date().toISOString();
        const lotId = uid();

        let existingStock = getProductStock(purchaseData.produitNom);
        if(existingStock){
          const oldQty = existingStock.qty || 0;
          const newQty = oldQty + totalUnits;
          existingStock.prixAchat = newQty > 0 ? +(((existingStock.prixAchat * oldQty) + totalCost) / newQty).toFixed(3) : unitCost;
          existingStock.qty = newQty;
          existingStock.prixVente = purchaseData.prixVenteSuggere;
          existingStock.dateMaj = now;
        } else {
          existingStock = {
            id: uid(),
            nom: purchaseData.produitNom,
            categorie: "Général",
            prixAchat: unitCost,
            prixVente: purchaseData.prixVenteSuggere,
            qty: totalUnits,
            dateMaj: now,
            image: purchaseData.image || '',
            seuilMin: 6
          };
          State.stock.push(existingStock);
        }

        State.lots.unshift({
          id: lotId,
          achatId: uid(),
          produitNom: purchaseData.produitNom,
          dateAchat: now,
          datePeremption: purchaseData.datePeremption || '',
          qtyInitiale: totalUnits,
          qtyReserve: totalUnits,
          qtyMachine: 0,
          prixPack: purchaseData.prixPack,
          unitesParPack: purchaseData.unitesParPack,
          nbPacks: purchaseData.nbPacks,
          prixAchatUnitaire: unitCost
        });

        State.achats.unshift({
          id: uid(),
          date: now,
          utilisateur: State.currentUser ? State.currentUser.nom : 'Admin',
          produitNom: purchaseData.produitNom,
          unitesParPack: purchaseData.unitesParPack,
          nbPacks: purchaseData.nbPacks,
          prixPack: purchaseData.prixPack,
          totalUnites: totalUnits,
          coutTotal: totalCost,
          prixAchatUnitaire: unitCost,
          datePeremption: purchaseData.datePeremption || '',
          lotId: lotId
        });

        addHistory('achat', 'Course enregistrée : ' + purchaseData.produitNom, purchaseData.nbPacks + ' packs de ' + purchaseData.unitesParPack + ' u. (' + totalUnits + ' u.) pour ' + fmtMoney(totalCost));

        await saveStock();
        await saveLots();
        await saveAchats();

        showToast("Course enregistrée");
        closeModal();
        renderCurrentTab();
      });
    }
  }

  const ov = openModal('', { wide: true });
  renderStepHtml();
}

/* ==========================================================================
   17. ONGLET STOCK & RÉSERVE
   ========================================================================== */
function renderStockTab(main){
  const totalUnitsReserve = State.stock.reduce((s,i) => s + (Number(i.qty) || 0), 0);
  const totalValeurAchat = State.stock.reduce((s,i) => s + ((Number(i.qty) || 0) * (Number(i.prixAchat) || 0)), 0);
  const machineUnits = State.distributeurs.reduce((acc, d) => acc + (d.floors ? d.floors.reduce((a,f) => a + f.rayons.reduce((b,r) => b + (Number(r.qty) || 0), 0), 0) : 0), 0);
  const displayedUnits = State.settings.includeMachineStock ? totalUnitsReserve + machineUnits : totalUnitsReserve;

  const shoppingList = getAllConfiguredProducts().map(function(p){
    const st = getProductStock(p.nom);
    const seuil = st ? (Number(st.seuilMin) || 0) : (Number(p.seuilMin) || 0);
    const current = State.settings.includeMachineStock ? getTotalStockFor(p.nom) : getReserveStockFor(p.nom);
    const missing = Math.max(0, seuil - current);
    return {
      nom: p.nom,
      current: current,
      seuil: seuil,
      missing: missing,
      image: p.image || getProductImage(p.nom),
      prixVente: p.prixVente
    };
  }).filter(x => x.seuil > 0 && x.current < x.seuil).sort((a,b) => b.missing - a.missing);

  main.innerHTML =
    '<div class="topbar">' +
      '<div>' +
        '<h2>Stock &amp; Réserve</h2>' +
        '<div class="sub">Gestion des approvisionnements et liste de courses</div>' +
      '</div>' +
      '<div class="topbar-actions">' +
        '<button class="btn btn-primary" id="st-add-course-btn">' +
          '<svg class="svg-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>' +
          'Ajouter une course' +
        '</button>' +
      '</div>' +
    '</div>' +

    '<div class="card" style="margin-bottom:20px;">' +
      '<div class="toggle-row">' +
        '<div>' +
          '<div class="tr-label">Inclure les produits présents dans le distributeur</div>' +
          '<div class="tr-sub">Activé : Stock total = Réserve (' + totalUnitsReserve + ') + Machine (' + machineUnits + ') = ' + (totalUnitsReserve + machineUnits) + ' u.</div>' +
        '</div>' +
        '<label class="switch"><input type="checkbox" id="st-toggle-include" ' + (State.settings.includeMachineStock ? 'checked' : '') + '><span class="switch-track"></span></label>' +
      '</div>' +
    '</div>' +

    '<div class="grid g4" style="margin-bottom:22px;">' +
      '<div class="card stat-card"><div class="label">' + (State.settings.includeMachineStock ? 'Unités totales' : 'Unités en réserve') + '</div><div class="value num" style="color:var(--apple-blue);">' + displayedUnits + '</div><div class="delta">En réserve : ' + totalUnitsReserve + ' u.</div></div>' +
      '<div class="card stat-card"><div class="label">Valeur achat réserve</div><div class="value num" style="color:var(--apple-green);">' + fmtMoney(totalValeurAchat) + '</div><div class="delta">Au coût moyen</div></div>' +
      '<div class="card stat-card"><div class="label">Références actives</div><div class="value num">' + State.stock.length + '</div><div class="delta">' + shoppingList.length + ' à commander</div></div>' +
      '<div class="card stat-card"><div class="label">Lots en réserve</div><div class="value num">' + State.lots.filter(l => (l.qtyReserve||0) > 0).length + '</div><div class="delta">Traçabilité active</div></div>' +
    '</div>' +

    (shoppingList.length ? '<div class="card" style="margin-bottom:22px;border-color:var(--apple-orange);">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">' +
        '<h3 style="margin:0;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;">' +
          '<span class="pill pill-amber">Commandes</span> Liste des achats recommandés (' + shoppingList.length + ')' +
        '</h3>' +
      '</div>' +
      '<div class="grid g3">' +
        shoppingList.map(function(s){
          return '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-secondary);padding:12px 14px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);">' +
            '<div style="display:flex;align-items:center;gap:10px;">' +
              '<div style="width:42px;height:42px;aspect-ratio:1/1;border-radius:10px;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;padding:4px;overflow:hidden;">' +
                (s.image ? '<img src="' + escapeHtml(resolveImageSrc(s.image)) + '" style="width:100%;height:100%;object-fit:contain;">' : '') +
              '</div>' +
              '<div><div style="font-weight:800;font-size:14.5px;">' + escapeHtml(s.nom) + '</div><div style="font-size:12px;color:var(--text-secondary);">Actuel: ' + s.current + ' / Seuil: ' + s.seuil + '</div></div>' +
            '</div>' +
            '<button class="btn btn-soft-blue st-quick-buy-btn" data-pname="' + escapeHtml(s.nom) + '" style="padding:8px 14px;font-size:13px;">+ Acheter ' + s.missing + '</button>' +
          '</div>';
        }).join('') +
      '</div>' +
    '</div>' : '') +

    '<div class="card">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">' +
        '<h3 style="margin:0;font-size:16px;font-weight:800;">Détail des stocks en réserve</h3>' +
      '</div>' +
      (State.stock.length ? '<div class="table-wrap"><table>' +
        '<thead><tr><th>Image</th><th>Produit</th><th>Réserve</th><th>Machine</th><th>Stock total</th><th>Prix achat</th><th>Prix vente</th><th>Marge</th><th>Seuil</th><th>Actions</th></tr></thead>' +
        '<tbody>' +
          State.stock.slice().sort((a,b) => a.nom.localeCompare(b.nom)).map(function(s){
            const machQty = getMachineQuantityFor(s.nom);
            const total = s.qty + machQty;
            const marge = s.prixVente - s.prixAchat;
            const imgSrc = resolveImageSrc(s.image);
            return '<tr>' +
              '<td><div style="width:38px;height:38px;aspect-ratio:1/1;border-radius:8px;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;padding:3px;overflow:hidden;">' + (imgSrc ? '<img src="' + escapeHtml(imgSrc) + '" style="width:100%;height:100%;object-fit:contain;">' : '—') + '</div></td>' +
              '<td><strong>' + escapeHtml(s.nom) + '</strong></td>' +
              '<td class="num" style="color:var(--apple-blue);font-weight:800;">' + s.qty + ' u.</td>' +
              '<td class="num">' + machQty + ' u.</td>' +
              '<td class="num"><strong>' + total + ' u.</strong></td>' +
              '<td class="num">' + fmtMoney(s.prixAchat) + '</td>' +
              '<td class="num">' + fmtMoney(s.prixVente) + '</td>' +
              '<td class="num" style="color:var(--apple-green);font-weight:700;">' + fmtMoney(marge) + '</td>' +
              '<td class="num">' + (s.seuilMin || 4) + '</td>' +
              '<td>' +
                '<button class="icon-btn st-quick-buy-btn" data-pname="' + escapeHtml(s.nom) + '" title="Acheter"><svg class="svg-icon" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></button> ' +
                '<button class="icon-btn danger st-del-stock-btn" data-sid="' + s.id + '" title="Supprimer"><svg class="svg-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>' +
              '</td>' +
            '</tr>';
          }).join('') +
        '</tbody>' +
      '</table></div>' : '<div style="text-align:center;padding:40px;color:var(--text-secondary);">Aucun produit en réserve. Cliquez sur "Ajouter une course" pour débuter.</div>') +
    '</div>';

  main.querySelector('#st-add-course-btn').addEventListener('click', () => openShoppingWizard());
  main.querySelector('#st-toggle-include').addEventListener('change', async (e) => {
    State.settings.includeMachineStock = e.target.checked;
    await saveSettings();
    renderStockTab(main);
  });

  main.querySelectorAll('.st-quick-buy-btn').forEach(btn => {
    btn.addEventListener('click', () => openShoppingWizard(btn.dataset.pname));
  });

  main.querySelectorAll('.st-del-stock-btn').forEach(btn => {

function filterDataByPeriod(arr, period, dateField){
  dateField = dateField || 'date';
  const now = new Date();
  let start = new Date(0);

  if(period === 'jour'){
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  } else if(period === 'hier'){
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return arr.filter(x => { const d = new Date(x[dateField]); return d >= start && d < end; });
  } else if(period === 'semaine'){
    const day = (now.getDay() + 6) % 7;
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day);
  } else if(period === 'mois'){
    start = new Date(now.getFullYear(), now.getMonth(), 1);
  } else if(period === 'annee'){
    start = new Date(now.getFullYear(), 0, 1);
  }

  return arr.filter(x => new Date(x[dateField]) >= start);
}

function openAjustementModal(){

      '</div>' +
    '</div>' +

      '<button class="btn btn-ghost" id="adj-cancel">Annuler</button>' +
      '<button class="btn btn-primary" id="adj-save">Enregistrer</button>' +
    '</div>';

  const ov = openModal(html);
  let sign = 1;

  ov.querySelector('#adj-btn-in').addEventListener('click', () => {
    sign = 1;
    ov.querySelector('#adj-btn-in').style.opacity = '1';
    ov.querySelector('#adj-btn-out').style.opacity = '.5';
  });
  ov.querySelector('#adj-btn-out').addEventListener('click', () => {
    sign = -1;
    ov.querySelector('#adj-btn-out').style.opacity = '1';
    ov.querySelector('#adj-btn-in').style.opacity = '.5';
  });

  ov.querySelector('#adj-close').addEventListener('click', closeModal);
  ov.querySelector('#adj-cancel').addEventListener('click', closeModal);
  ov.querySelector('#adj-save').addEventListener('click', async () => {
    const raw = ov.querySelector('#adj-montant-inp').value;
    const montant = parseFrenchNumber(raw);
    if(montant <= 0){ alert("Veuillez saisir un montant valide."); return; }
    const raison = ov.querySelector('#adj-raison-inp').value.trim() || 'Ajustement';

    State.ajustements.unshift({
      id: uid(),
      date: new Date().toISOString(),
      utilisateur: State.currentUser ? State.currentUser.nom : 'Admin',
      montant: sign * montant,
      raison: raison
    });

    addHistory('ajustement', 'Ajustement de caisse : ' + (sign > 0 ? '+' : '') + fmtMoney(sign * montant), raison);
    await saveAjustements();
    showToast("Ajustement enregistré");
    closeModal();
    renderCurrentTab();
  });
}

function renderStatsTab(main){
  destroyActiveCharts();
  const distrib = getCurrentDistrib();
  const criterion = State.statsCriterion || 'ca';

  const productStats = {};
  const rayonStats = {};
  const monthlyRevenue = {};

  State.remplissages.forEach(function(r){
    const d = new Date(r.date);
    const mKey = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    monthlyRevenue[mKey] = (monthlyRevenue[mKey] || 0) + (r.totalMontant || 0);

    r.lignes.forEach(function(l){
      const pName = l.produitNom;
      if(!productStats[pName]){
        productStats[pName] = { qty: 0, ca: 0, cout: 0, benefice: 0 };
      }
      productStats[pName].qty += (l.qtyVendu || 0);
      productStats[pName].ca += (l.montantVente || 0);
      productStats[pName].cout += (l.coutVendu || 0);
      productStats[pName].benefice += ((l.montantVente || 0) - (l.coutVendu || 0));

      const rKey = (l.floorNom || '') + ' · ' + (l.rayonNumero || '');
      if(!rayonStats[rKey]){
        rayonStats[rKey] = { qty: 0, ca: 0, cout: 0, benefice: 0 };
      }
      rayonStats[rKey].qty += (l.qtyVendu || 0);
      rayonStats[rKey].ca += (l.montantVente || 0);
      rayonStats[rKey].benefice += ((l.montantVente || 0) - (l.coutVendu || 0));
    });
  });

  const topProductsBySales = Object.entries(productStats).sort((a,b) => b[1].qty - a[1].qty);
  const topProductsByProfit = Object.entries(productStats).sort((a,b) => b[1].benefice - a[1].benefice);

  let maxCritValue = 1;
  if(distrib && distrib.floors){
    distrib.floors.forEach(f => f.rayons.forEach(r => {
      const stats = rayonStats[f.nom + ' · ' + r.numero] || { qty: 0, ca: 0, benefice: 0 };
      const val = criterion === 'ventes' ? stats.qty : (criterion === 'benefice' ? stats.benefice : stats.ca);
      if(val > maxCritValue) maxCritValue = val;
    }));
  }

  main.innerHTML =

      '<div class="topbar-actions">' +
        (State.distributeurs.length > 1 ? '<select id="st-distrib-filter" class="field" style="margin-bottom:0;padding:8px 12px;font-size:13.5px;border-radius:12px;font-weight:700;">' +

      '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;">' +
        '<div>' +
          '<h3 style="margin:0;font-size:17px;font-weight:900;">Réplique 2D Thermique du Distributeur</h3>' +
          '<div style="font-size:13px;color:var(--text-secondary);">Indicateur d\'intensité selon vos ventes</div>' +
        '</div>' +
        '<div class="seg" id="hm-crit-seg">' +
          '<button data-crit="ca" class="' + (criterion === 'ca' ? 'active' : '') + '">Chiffre d\'affaires (€)</button>' +
          '<button data-crit="ventes" class="' + (criterion === 'ventes' ? 'active' : '') + '">Ventes (u.)</button>' +
          '<button data-crit="benefice" class="' + (criterion === 'benefice' ? 'active' : '') + '">Bénéfice (€)</button>' +
        '</div>' +
      '</div>' +

      '<div class="heatmap-grid">' +

            '<div class="heatmap-slots">' +
              f.rayons.map(function(r){

                const val = criterion === 'ventes' ? stats.qty : (criterion === 'benefice' ? stats.benefice : stats.ca);
                const intensity = maxCritValue > 0 ? Math.min(1, Math.max(0.1, val / maxCritValue)) : 0.1;
                const bgStyle = 'background: rgba(0, 122, 255, ' + (0.08 + (intensity * 0.45)) + '); border-color: rgba(0, 122, 255, ' + (0.15 + (intensity * 0.5)) + ');';

    historique: State.historique,
    profiles: State.profiles,

      '<button class="btn btn-primary" id="bkc-restore-btn">Restaurer le texte</button>' +
    '</div>';

  const ov = openModal(html, { wide: true });
  ov.querySelector('#bkc-close').addEventListener('click', closeModal);

  ov.querySelector('#bkc-copy-btn').addEventListener('click', () => {
    const ta = ov.querySelector('#bkc-textarea');
    ta.select();
    navigator.clipboard.writeText(ta.value);
    showToast("JSON copié !");
  });

  ov.querySelector('#bkc-restore-btn').addEventListener('click', async () => {
    const text = ov.querySelector('#bkc-textarea').value.trim();

function openAddUserModal(){

    '</div>' +
    '<div class="modal-foot">' +
      '<button class="btn btn-ghost" id="usr-cancel">Annuler</button>' +
      '<button class="btn btn-primary" id="usr-save">Créer l\'utilisateur</button>' +
    '</div>';

  const ov = openModal(html);
  ov.querySelector('#usr-close').addEventListener('click', closeModal);
  ov.querySelector('#usr-cancel').addEventListener('click', closeModal);

  ov.querySelector('#usr-nom-inp').addEventListener('input', (e) => {
    const clean = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '');
    ov.querySelector('#usr-id-inp').value = clean ? clean + '-' + Math.random().toString(36).slice(2, 5) : '';
  });

  ov.querySelector('#usr-save').addEventListener('click', async () => {
    const nom = ov.querySelector('#usr-nom-inp').value.trim();
    const identifiant = ov.querySelector('#usr-id-inp').value.trim();
    const pw = ov.querySelector('#usr-pw-inp').value;
    const role = ov.querySelector('#usr-role-inp').value;

    if(!nom || !identifiant || !pw){ alert("Veuillez remplir tous les champs."); return; }

    const salt = uid();
    const pwHash = await hashPassword(pw, salt);

    State.profiles.push({
      id: uid(),
      nom: nom,
      identifiant: identifiant,
      passwordHash: pwHash,
      salt: salt,
      role: role,
      dateCreation: new Date().toISOString(),
      actif: true
    });

    await saveProfiles();
    addHistory('user', 'Nouvel utilisateur créé : ' + nom + ' (' + identifiant + ')');
    showToast("Utilisateur créé");
    closeModal();
    renderCurrentTab();
  });
}

   ========================================================================== */
const loginForm = document.getElementById('login-form');
const loginErr = document.getElementById('login-err');

loginForm.addEventListener('submit', async function(e){
  e.preventDefault();
  const idInput = document.getElementById('login-id').value.trim();
  const pwInput = document.getElementById('login-pw').value;

  loginErr.textContent = "";

  if(idInput === ROOT_ADMIN_ID && pwInput === ROOT_ADMIN_PW){
    State.currentUser = {
      id: 'root-admin',
      nom: 'Administrateur',
      identifiant: ROOT_ADMIN_ID,
      role: 'admin'
    };
    startAppSession();
    return;
  }

  const profiles = await storeGet('profiles', []);
  let foundUser = null;
  for(const p of profiles){
    if(p.identifiant.toLowerCase() === idInput.toLowerCase()){
      const checkHash = await hashPassword(pwInput, p.salt || 'vezune-salt-v2');
      if(checkHash === p.passwordHash || pwInput === p.motDePasse){
        foundUser = p;
        break;
      }
    }
  }

  if(foundUser){
    State.currentUser = {
      id: foundUser.id,
      nom: foundUser.nom,
      identifiant: foundUser.identifiant,
      role: foundUser.role || 'user'
    };
    startAppSession();
  } else {
    loginErr.textContent = "Identifiant ou mot de passe incorrect.";
  }
});

async function startAppSession(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'block';
  document.getElementById('who-line').textContent = State.currentUser.nom + ' (' + State.currentUser.identifiant + ')';
  document.getElementById('profil-nom-side').textContent = State.profil ? State.profil.nom : 'Vezune';

  await loadAll();
  bindNavigation();
  switchTab(State.currentTab || 'distributeur');
  showToast("Bienvenue, " + State.currentUser.nom);
}

async function doLogout(){
  markSaving();
  await saveAllNow();
  markSaved();
  State.currentUser = null;
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-id').value = '';
  document.getElementById('login-pw').value = '';
  showToast("Déconnexion réussie");
}

/* ==========================================================================
   24. DÉMARRAGE RAPIDE
   ========================================================================== */
(async function initEarly(){
  try {
    const s = await storeGet('settings', { darkMode: true });
    if(s && s.darkMode != null){
      State.settings = s;
      applyTheme();
    }
  } catch(e){}
})();

})();
</script>
